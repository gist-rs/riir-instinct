[package]
name = "riir-instinct"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake3 = "1"
# preserve_order: the criteria object's INSERTION ORDER is the presented
# option order — the bridge's index space shifts if reordered
# (parity-critical; the reflex-side reason verbatim). Declared LOCALLY so
# the law survives reflex dropping it (feature unification is an accident,
# not a contract).
serde_json = { version = "1", features = ["preserve_order"] }
# derive: the /decide request envelope at the HTTP edge (already in-tree
# via katgpt-core's non-optional serde — no new package; edge-only by law,
# the reflex serve posture).
serde = { version = "1", features = ["derive"] }
# The arsenal manifest (Proposal 001 T1): TOML parse of `arsenal.toml` —
# the ONE selection surface for the hosted serving lane (law A5).
# parse-only: the manifest is read, never written, by this crate.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# `set_admission`: the Vendi certificate + colinearity anchors of the
# arsenal hoarding gate (Proposal 001 T5) — consumed, never forked.
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core", default-features = false, features = ["best_belief", "sigmoid_calibration", "set_admission"] }
riir-reflex = { path = "../riir-reflex", default-features = false, features = ["modelless", "nb_scope", "nb_ridge", "option_cond"] }
reflexer-vessel = { path = "../riir-reflexer/crates/reflexer-vessel", optional = true }
ed25519-dalek = { version = "2", optional = true }
# The decstat wire client + HTTP transport (Plan 002 / Issue 004 T2's
# landed half): the protocol composer is feature-free in riir-kat; the
# client/transport tiers ride `kat_transport` (implies `client`). Path
# sibling — the account_key tier it implies pulls riir-auth →
# riir-neuron-db, all path deps that already resolve in this layout.
riir-kat = { path = "../riir-kat", optional = true, default-features = false, features = ["kat_transport"] }
# The lock-free capture counters (the house rule for the shared map;
# version-matched to the riir-auth pin already in this graph so one copy
# compiles).
papaya = { version = "0.2", optional = true }
# The tetris lane (Issue 009 T5/T6): the katgpt-rs substrate module — the
# board sim + seeded 7-bag + garbage starts + the frozen Bench-892 champion
# genome (the same crate public reflexer consumes under the same leaf law;
# NOT a game runtime — the boundary's "no game crates" row targets
# riir-ai's game stack). Opt-in behind `tetris`; fastrand is
# version-matched to the katgpt-rs pin ("2") so one copy compiles.
katgpt-tetris = { path = "../katgpt-rs/crates/katgpt-tetris", optional = true }
fastrand = { version = "2", optional = true }

[features]
default = []
# The HOSTED-ONLY vessel reader (Plan 001 P4 / Issue 001): the format
# crate + its ed25519 signature stack. The arena/specialist lanes never
# resolve it.
vessel = ["dep:reflexer-vessel", "dep:ed25519-dalek"]
# The arena's laya paired face (G2): forwards reflex's laya-riir — the
# metal/tokenizers tree compiles only under this feature.
arena-laya = ["riir-reflex/laya-riir"]
# The decstat flywheel capture (Plan 002 / Issue 004 T1): consent-gated
# decision-outcome stats over the riir-kat wire (lane "dec"). Opt-in —
# default builds never resolve the wire/transport tree and the /decide
# path is byte-identical (the record call compiles out).
decstat = ["dep:riir-kat", "dep:papaya", "dep:ed25519-dalek"]
# The arsenal budget legs' GOAT bench (Proposal 001 T8): gates nothing in
# the lib — it selects `benches/arsenal_budget_goat` so the default
# `cargo test`/`cargo bench` never pays its corpus-boot cost.
arsenal_goat = []
# The Tetris lane (Issue 009 T5/T6): the measurement harness module + the
# chance_puct teacher. Opt-in — default builds never resolve the tetris
# substrate, and the /decide path is byte-identical.
tetris = ["dep:katgpt-tetris", "dep:fastrand", "katgpt-core/chance_puct"]
# The teacher-check bench target (007): selects `benches/
# tetris_teacher_check` behind the lane feature.
tetris_goat = ["tetris"]

[workspace]

# The katgpt-rs patch unification: the decstat feature's tree (riir-kat
# → riir-auth → riir-neuron-db) reaches the katgpt crates by GIT URL,
# and a dependency manifest's [patch] is WORKSPACE-SCOPED — it does not
# travel through path deps to a build root that never declared it. The
# boundary gate's C7 check caught the result (the lock resolving
# katgpt-core twice: the git rev + this repo's path dep — non-unifying
# types). Same list as riir-auth's root manifest; katgpt-attn-match is
# pre-covered so enabling neuron-db's optional shard_compactor cannot
# resurrect the churn.
[patch."https://github.com/katopz/katgpt-rs"]
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core" }
katgpt-dec = { path = "../katgpt-rs/crates/katgpt-dec" }
katgpt-device-verify = { path = "../katgpt-rs/crates/katgpt-device-verify" }
katgpt-hla = { path = "../katgpt-rs/crates/katgpt-hla" }
katgpt-micro-belief = { path = "../katgpt-rs/crates/katgpt-micro-belief" }
katgpt-personality = { path = "../katgpt-rs/crates/katgpt-personality" }
katgpt-sense = { path = "../katgpt-rs/crates/katgpt-sense" }
katgpt-types = { path = "../katgpt-rs/crates/katgpt-types" }
# katgpt-attn-match: deliberately pre-covered (the riir-auth/riir-kat
# convention) — unused in today's graph; cargo prints an informational
# `patch ... was not used` note per build.
katgpt-attn-match = { path = "../katgpt-rs/crates/katgpt-attn-match" }

# The vessel gate taxonomy — whole-file gated, so the required-features
# row is what keeps a plain `cargo test` from running a green zero
# (the repo-birth gate discipline).
[[test]]
name = "vessel_gates"
required-features = ["vessel"]

[[test]]
name = "decstat_gates"
required-features = ["decstat"]

# The arsenal GOAT bench (Proposal 001 T8) — whole-target gated; the
# required-features row keeps a plain `cargo bench` from building it.
[[bench]]
name = "arsenal_budget_goat"
harness = false
required-features = ["arsenal_goat"]

# The tetris teacher-check bench (Issue 009 T6) — whole-target gated.
[[bench]]
name = "tetris_teacher_check"
harness = false
required-features = ["tetris_goat"]
