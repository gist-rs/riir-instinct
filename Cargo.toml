[package]
name = "riir-instinct"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
blake3 = "1"
# preserve_order: the criteria object's INSERTION ORDER is the presented
# option order — the bridge's index space shifts if reordered
# (parity-critical; the reflex-side reason verbatim). Declared LOCALLY so
# the law survives reflex dropping it (feature unification is an accident,
# not a contract).
serde_json = { version = "1", features = ["preserve_order"] }
# derive: the /decide request envelope at the HTTP edge (already in-tree
# via katgpt-core's non-optional serde — no new package; edge-only by law,
# the reflex serve posture).
serde = { version = "1", features = ["derive"] }
# The arsenal manifest (Proposal 001 T1): TOML parse of `arsenal.toml` —
# the ONE selection surface for the hosted serving lane (law A5).
# parse-only: the manifest is read, never written, by this crate.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# `set_admission`: the Vendi certificate + colinearity anchors of the
# arsenal hoarding gate (Proposal 001 T5) — consumed, never forked.
katgpt-core = { path = "../katgpt-rs/crates/katgpt-core", default-features = false, features = ["best_belief", "sigmoid_calibration", "set_admission"] }
riir-reflex = { path = "../riir-reflex", default-features = false, features = ["modelless", "nb_scope", "nb_ridge", "option_cond"] }
# The PUBLIC-RELEASE vessel reader (the teaching posture; Proposal 052):
# reflexer's public decode/open — the HOSTED-ONLY class refuses here
# fail-closed and reads in the private Rethink lane backend.
reflexer-vessel = { path = "../riir-reflexer/crates/reflexer-vessel", optional = true }
# The Tetris lane (Issue 009 T5/T6): the katgpt-rs substrate module — the
# board sim + seeded 7-bag + garbage starts + the frozen Bench-892 champion
# genome (the same crate public reflexer consumes under the same leaf law;
# NOT a game runtime — the boundary's "no game crates" row targets
# riir-ai's game stack). Opt-in behind `tetris`; fastrand is
# version-matched to the katgpt-rs pin ("2") so one copy compiles.
# katgpt-core/karc_forecaster: the T8 modelless arm's fit substrate — the
# Plan-308 KARC basis (ChebyshevBasis) + chunked Gram + the
# ridge_solve_direct_f64 re-export (default-on upstream; here opt-in with
# the lane).
katgpt-tetris = { path = "../katgpt-rs/crates/katgpt-tetris", optional = true }
fastrand = { version = "2", optional = true }

[dev-dependencies]
# Test-side vessel MINTING only (arsenal_ops's vessel_identity_tests +
# teaching-bench fixtures): the public reader needs no signing stack; the
# lib surface carries zero ed25519.
ed25519-dalek = "2"
# The L1 training lane's tests (Plan 008 B4 lift): the sealed-envelope
# fixtures build scratch trees per test.
tempfile = "3"

[features]
default = []
# The PUBLIC-RELEASE vessel reader (the teaching posture; Proposal 052):
# reflexer's public decode/open over the operator pin table. The
# HOSTED-ONLY class refuses here fail-closed (that class reads in the
# private Rethink lane backend); the arena/specialist lanes never
# resolve it.
vessel = ["dep:reflexer-vessel"]
# The arena's laya paired face (G2, the external-comparison instrument
# against public reflex's laya lane): forwards reflex's laya-riir — the
# metal/tokenizers tree compiles only under this feature. (Named
# `laya-face` post-split — the old spelling retired with the encoder
# face the carve moved to the moat.)
laya-face = ["riir-reflex/laya-riir"]
# The Metal posture of the same lane (instinct issue 014 C1).
laya-face-metal = ["laya-face", "riir-reflex/laya-riir-metal"]
# The arsenal budget legs' GOAT bench (Proposal 001 T8): gates nothing in
# the lib — it selects `benches/arsenal_budget_goat` so the default
# `cargo test`/`cargo bench` never pays its corpus-boot cost.
arsenal_goat = []
# The Tetris lane (Issue 009 T5/T6): the measurement harness module + the
# chance_puct teacher. Opt-in — default builds never resolve the tetris
# substrate, and the /decide path is byte-identical.
tetris = ["dep:katgpt-tetris", "dep:fastrand", "katgpt-core/chance_puct", "katgpt-core/karc_forecaster"]
# The teacher-check bench target (007) + the critic-arm bench target
# (009): select their bench targets behind the lane feature.
tetris_goat = ["tetris"]

[workspace]

# The Issue 580 T5 parity gate (train-side scores == serve-side scores).
# Env-driven: skips loud without TET_CRITIC_MODEL + the parity fixture.
[[test]]
name = "tetris_critic_parity"
required-features = ["tetris"]

# The arsenal GOAT bench (Proposal 001 T8) — whole-target gated; the
# required-features row keeps a plain `cargo bench` from building it.
[[bench]]
name = "arsenal_budget_goat"
harness = false
required-features = ["arsenal_goat"]

# The tetris teacher-check bench (Issue 009 T6) — whole-target gated.
[[bench]]
name = "tetris_teacher_check"
harness = false
required-features = ["tetris_goat"]

# The tetris critic-arm bench (Issue 009 T8 second arm) — whole-target gated.
[[bench]]
name = "tetris_critic_goat"
harness = false
required-features = ["tetris_goat"]

# The round-5 teacher A/B (issue 009 pre-registration) — whole-target gated.
[[bench]]
name = "tetris_round5_teacher_ab"
harness = false
required-features = ["tetris_goat"]

# The T7 dataset export (Issue 580's contract) — whole-target gated.
[[bin]]
name = "export_tetris_critic"
required-features = ["tetris"]

# The round-5 per-seed scale probe (Issue 009 T7 round 5, Bench 025/026) —
# imports the tetris-only surface (tetris_blend/tetris_critic/tetris_lane +
# katgpt_tetris); without this row a plain --all-targets build at default
# features fails E0432/E0433 (the tetris_critic_parity row's own class).
[[example]]
name = "tetris_round5_scale_probe"
required-features = ["tetris"]
