# generated by riir-deploy — cf-container target 'decisions'
# instance_type standard-2: the measured floor (lite 1/16 vCPU throttles
# a 20 Hz tick 12-16x — Issue 030; container viable at CCU, Bench 034)
name = "riir-instinct"
main = "worker.js"
compatibility_date = "2026-01-01"

[containers]
instance_type = "standard-2"
max_instances = 1
listening_port = 8080

[env_vars]
RIIR_DEPLOY_TARGET = "decisions"
INSTINCT_DATASETS_DIR = "/app/data/datasets"
INSTINCT_WINNERS_DIR = "/app/data/winners"
