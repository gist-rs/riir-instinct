# moat/Cargo.toml — the Rethink lane's manifest TEMPLATE.
#
# ⛔ NOT A WORKSPACE MEMBER — never built in this repo. `moat/` is the
# Rethink seed (Proposal 052): this file documents the dependency closure
# the private lane needs at its birth, so the lift is a rename-and-build,
# not an archaeology dig. Cargo ignores it (nothing references it; the
# enclosing workspace never names this directory).
#
# At the Rethink lift:
#   - uncomment [package] and give it the Rethink crate name
#   - the path deps resolve against the standard /git sibling layout
#   - reflexer-vessel gains its HOSTED-ONLY reader capability feature
#     (`vessel_hosted_read` — the public repo keeps `vessel_public_read`
#     only; the capability split is reflexer Proposal 001 A1/A10)
#   - the moat tests' [[test]] rows move here (required-features below
#     mirror what the open Cargo.toml carried at the carve)

[package]
# name = "riir-rethink"
# version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The open Instinct crate — the lane-backend seam's host (riir-refine
# shape: the moat sits DOWNSTREAM of the open code).
# riir-instinct = { path = "../riir-instinct" }
# The decstat wire (protocol + transport tiers).
# riir-kat = { path = "../riir-kat", default-features = false, features = ["kat_transport"] }
# The lock-free capture counters (the house rule for the shared map).
# papaya = "0.2"
# The hosted vessel reader's signature stack + format crate (hosted class).
# reflexer-vessel = { path = "../riir-reflexer/crates/reflexer-vessel", features = ["vessel_hosted_read"] }
# The encoder lane's laya substrate (via public reflex's forwarding).
# riir-reflex = { path = "../riir-reflex", default-features = false, features = ["modelless", "laya-riir"] }

[features]
# serve-encoder = ["serve-encoder-shared"]
# serve-encoder-shared = []
# decstat = ["dep:riir-kat", "dep:papaya"]
# vessel = ["dep:reflexer-vessel"]
