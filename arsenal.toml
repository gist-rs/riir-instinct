class   = "hosted_only"
posture = { arm = "H2", beta = 0.25, n_min = 2.0, tau_n = 2.0 }      # best measured 0.8975 vs A0 0.8825 (+1.5 pt; T2 LB95 -0.0100 — uncertified, serves under best-measured; certify at T4/T5)
pin_keys = []
budget  = { load = "eager", max_payload_mb = 16 }

