<svg xmlns="http://www.w3.org/2000/svg" id="instinct-flow" data-gfflow="1" viewBox="0 0 1462 724" width="1462" height="724" role="img" aria-labelledby="instinct-flow-t instinct-flow-d">
<title id="instinct-flow-t">Instinct: the trained add-on composes on top of the free floor</title>
<desc id="instinct-flow-d">8 steps in path order. 1. Your question: the same typed question — choice, score or yes-no (your machine; live). 2. Reflex answers first: embed, route, score; the fused gate checks confidence (your machine; live). 3a. If sure: Answer + receipt: microseconds, calibrated — the specialist is never paid (your machine; live). 3b.1. If not sure: Abstain, prune: only abstains go on; top-k keeps the candidates (the open lane; live). 3b.2. Specialist scores: locked per-domain artifacts — never blended (the open lane; live). 3b.3. Fuse and calibrate: a cascade pick or prior fusion returns one calibrated answer (the open lane; live). 4. If still unsure: The encoder rung: one rung deeper where bags read too coarse (our hosts; planned · record-only). 5. Registered arms: each beat free Reflex on one frozen read (the manifest; live). From 3b.3 back to 3a. From 4 back to 3a: the think returns — planned. From 5 back to 3b.2: swapped whole.</desc>
<style>#instinct-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#instinct-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#instinct-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#instinct-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#instinct-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#instinct-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#instinct-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#instinct-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#instinct-flow .e{fill:none;stroke-width:1.6}#instinct-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="instinct-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker><marker id="instinct-flow-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a3d"/></marker><marker id="instinct-flow-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker></defs>
<rect width="1462" height="724" rx="14" fill="#11141b"/>
<g data-lane="me"><rect x="10" y="12" width="1442" height="166" rx="16" fill="#ff8a3d" fill-opacity=".06" stroke="#ff8a3d" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#ff8a3d">YOUR MACHINE</tspan><tspan class="ln" dx="12">the Reflex floor · private · free</tspan></text></g>
<g data-lane="lane"><rect x="10" y="190" width="1442" height="166" rx="16" fill="#f472b6" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#f472b6">THE OPEN LANE</tspan><tspan class="ln" dx="12">Instinct hybrid · CPU · serves live</tspan></text></g>
<g data-lane="host"><rect x="10" y="368" width="1442" height="166" rx="16" fill="#a98bfa" fill-opacity=".06" stroke="#a98bfa" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#a98bfa">OUR HOSTS</tspan><tspan class="ln" dx="12">the encoder rung · record-only</tspan></text></g>
<g data-lane="ops"><rect x="10" y="546" width="1442" height="166" rx="16" fill="#f472b6" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".4"/><text x="30" y="571"><tspan class="lh" fill="#f472b6">THE MANIFEST</tspan><tspan class="ln" dx="12">the one selection surface</tspan></text></g>
<g data-edge="ask->floor"><path class="e" d="M260,108 324,108" stroke="#69718a" marker-end="url(#instinct-flow-a0)"/></g>
<g data-edge="floor->ans"><path class="e" d="M554,81 618,81" stroke="#69718a" marker-end="url(#instinct-flow-a0)"/><text class="el" x="586" y="72" text-anchor="middle">sure</text></g>
<g data-edge="floor->prune"><path class="e" d="M439,162 439,286 618,286" stroke="#69718a" marker-end="url(#instinct-flow-a0)"/><text class="el" x="528.5" y="277" text-anchor="middle">not sure</text></g>
<g data-edge="prune->score"><path class="e" d="M848,286 912,286" stroke="#69718a" marker-end="url(#instinct-flow-a0)"/></g>
<g data-edge="score->fuse"><path class="e" d="M1142,304 1206,304" stroke="#69718a" marker-end="url(#instinct-flow-a0)"/></g>
<g data-edge="fuse->enc"><path class="e" d="M1321,340 1321,410" stroke="#69718a" marker-end="url(#instinct-flow-a0)"/><text class="el" x="1331" y="379" text-anchor="start">still unsure</text></g>
<g data-edge="fuse->ans"><path class="eb" d="M1206,268 586,268 586,108 618,108" stroke="#ff8a3d" marker-end="url(#instinct-flow-a1)"/></g>
<g data-edge="enc->ans"><path class="eb" d="M1206,464 586,464 586,135 618,135" stroke="#ff8a3d" marker-end="url(#instinct-flow-a1)"/><text class="el" x="896" y="455" text-anchor="middle" style="fill:#ff8a3d">the think returns — planned</text></g>
<g data-edge="manifest->score"><path class="eb" d="M1027,588 1027,340" stroke="#f472b6" marker-end="url(#instinct-flow-a2)"/><text class="el" x="1037" y="418.4" text-anchor="start" style="fill:#f472b6">swapped whole</text></g>
<g data-step="ask" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#ff8a3d"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Your question</text><text x="46" y="109" class="d">the same typed question —</text><text x="46" y="128" class="d">choice, score or yes-no</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="floor" data-n="2"><rect class="gf-cb" x="324" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><circle cx="346" cy="78" r="12" fill="#ff8a3d"/><text x="346" y="82.5" text-anchor="middle" class="n">2</text><text x="368" y="83" class="t">Reflex answers first</text><text x="340" y="109" class="d">embed, route, score; the fused</text><text x="340" y="128" class="d">gate checks confidence</text><circle cx="344" cy="146" r="4" fill="#4ade80"/><text x="354" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="ans" data-n="3a"><rect class="gf-cb" x="618" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="628" y="66" width="29.6" height="24" rx="12" fill="#ff8a3d"/><text x="642.8" y="82.5" text-anchor="middle" class="n">3a</text><text x="667.6" y="83" class="t">Answer + receipt</text><text x="634" y="109" class="d">microseconds, calibrated —</text><text x="634" y="128" class="d">the specialist is never paid</text><circle cx="638" cy="146" r="4" fill="#4ade80"/><text x="648" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="prune" data-n="3b.1"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="628" y="244" width="42.1" height="24" rx="12" fill="#f472b6"/><text x="649" y="260.5" text-anchor="middle" class="n">3b.1</text><text x="680.1" y="261" class="t">Abstain, prune</text><text x="634" y="287" class="d">only abstains go on; top-k</text><text x="634" y="306" class="d">keeps the candidates</text><circle cx="638" cy="324" r="4" fill="#4ade80"/><text x="648" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="score" data-n="3b.2"><rect class="gf-cb" x="912" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="922" y="244" width="42.1" height="24" rx="12" fill="#f472b6"/><text x="943" y="260.5" text-anchor="middle" class="n">3b.2</text><text x="974.1" y="261" class="t">Specialist scores</text><text x="928" y="287" class="d">locked per-domain artifacts —</text><text x="928" y="306" class="d">never blended</text><circle cx="932" cy="324" r="4" fill="#4ade80"/><text x="942" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="fuse" data-n="3b.3"><rect class="gf-cb" x="1206" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="1216" y="244" width="42.1" height="24" rx="12" fill="#f472b6"/><text x="1237" y="260.5" text-anchor="middle" class="n">3b.3</text><text x="1268.1" y="261" class="t">Fuse and calibrate</text><text x="1222" y="287" class="d">a cascade pick or prior fusion</text><text x="1222" y="306" class="d">returns one calibrated answer</text><circle cx="1226" cy="324" r="4" fill="#4ade80"/><text x="1236" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="enc" data-n="4"><rect class="gf-cb" x="1206" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><circle cx="1228" cy="434" r="12" fill="#a98bfa"/><text x="1228" y="438.5" text-anchor="middle" class="n">4</text><text x="1250" y="439" class="t">The encoder rung</text><text x="1222" y="465" class="d">one rung deeper where bags</text><text x="1222" y="484" class="d">read too coarse</text><circle cx="1226" cy="502" r="4" fill="none" stroke="#9299ab" stroke-width="1.5"/><text x="1236" y="506" class="s" fill="#9299ab">planned · record-only</text></g>
<g data-step="manifest" data-n="5"><rect class="gf-cb" x="912" y="588" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="934" cy="612" r="12" fill="#f472b6"/><text x="934" y="616.5" text-anchor="middle" class="n">5</text><text x="956" y="617" class="t">Registered arms</text><text x="928" y="643" class="d">each beat free Reflex on one</text><text x="928" y="662" class="d">frozen read</text><circle cx="932" cy="680" r="4" fill="#4ade80"/><text x="942" y="684" class="s" fill="#4ade80">live</text></g>
</svg>
