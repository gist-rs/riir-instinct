<svg xmlns="http://www.w3.org/2000/svg" id="instinct-flow-m" data-gfflow="1" viewBox="0 0 340 1316" width="340" height="1316" role="img" aria-labelledby="instinct-flow-m-t instinct-flow-m-d">
<title id="instinct-flow-m-t">Instinct: the trained add-on composes on top of the free floor</title>
<desc id="instinct-flow-m-d">8 steps in path order. 1. Your question: the same typed question — choice, score or yes-no (your machine; live). 2. Reflex answers first: embed, route, score; the fused gate checks confidence (your machine; live). 3a. If sure: Answer + receipt: microseconds, calibrated — the specialist is never paid (your machine; live). 3b.1. If not sure: Abstain, prune: only abstains go on; top-k keeps the candidates (the open lane; live). 3b.2. Specialist scores: locked per-domain artifacts — never blended (the open lane; live). 3b.3. Fuse and calibrate: a cascade pick or prior fusion returns one calibrated answer (the open lane; live). 4. If still unsure: The encoder rung: one rung deeper where bags read too coarse (our hosts; planned · record-only). 5. Registered arms: each beat free Reflex on one frozen read (the manifest; live). From 3b.3 back to 3a. From 4 back to 3a: the think returns — planned. From 5 back to 3b.2: swapped whole.</desc>
<style>#instinct-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#instinct-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#instinct-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#instinct-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#instinct-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#instinct-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#instinct-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="instinct-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="1316" rx="14" fill="#11141b"/>
<g data-step="ask" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="30" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#ff8a3d"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Your question</text><text x="22" y="80" class="d">the same typed question — choice, score or</text><text x="22" y="98" class="d">yes-no</text></g>
<g data-edge="ask->floor"><path class="e" d="M44,112 V152" stroke="#69718a" marker-end="url(#instinct-flow-m-a0)"/>
</g>
<g data-step="floor" data-n="2"><rect class="gf-cb" x="4" y="152" width="332" height="136" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="164" width="4" height="112" rx="2" fill="#ff8a3d"/><text x="22" y="174" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="170" r="3.5" fill="#4ade80"/><text x="318" y="174" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="195" r="11" fill="#ff8a3d"/><text x="33" y="199.5" text-anchor="middle" class="n">2</text><text x="54" y="200" class="t">Reflex answers first</text><text x="22" y="224" class="d">embed, route, score; the fused gate checks</text><text x="22" y="242" class="d">confidence</text><rect x="22" y="254" width="104.8" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="30" y="268" class="el">→ 3a · sure</text><rect x="132.8" y="254" width="148" height="20" rx="10" fill="none" stroke="#343b4b"/><text x="140.8" y="268" class="el">→ 3b.1 · not sure</text></g>
<g data-edge="floor->ans"><path class="e" d="M44,288 V328" stroke="#69718a" marker-end="url(#instinct-flow-m-a0)"/>
<text class="el" x="56" y="312">sure</text>
</g>
<g data-step="ans" data-n="3a"><rect class="gf-cb" x="4" y="328" width="332" height="104" rx="12" fill="#161a23" stroke="#ff8a3d" stroke-opacity=".6"/><rect x="4" y="340" width="4" height="80" rx="2" fill="#ff8a3d"/><text x="22" y="350" class="k" fill="#ff8a3d">YOUR MACHINE</text><circle cx="280.2" cy="346" r="3.5" fill="#4ade80"/><text x="318" y="350" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="360" width="29.6" height="22" rx="11" fill="#ff8a3d"/><text x="36.8" y="375.5" text-anchor="middle" class="n">3a</text><text x="61.6" y="376" class="t">Answer + receipt</text><text x="22" y="400" class="d">microseconds, calibrated — the specialist is</text><text x="22" y="418" class="d">never paid</text></g>
<g data-edge="floor->prune"><path class="e" d="M44,438 V466" stroke="#69718a" stroke-dasharray="3 4"/><text class="el" x="56" y="456">↳ from 2 · not sure</text></g>
<g data-step="prune" data-n="3b.1"><rect class="gf-cb" x="4" y="472" width="332" height="104" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="484" width="4" height="80" rx="2" fill="#f472b6"/><text x="22" y="494" class="k" fill="#f472b6">THE OPEN LANE</text><circle cx="280.2" cy="490" r="3.5" fill="#4ade80"/><text x="318" y="494" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="504" width="42.1" height="22" rx="11" fill="#f472b6"/><text x="43" y="519.5" text-anchor="middle" class="n">3b.1</text><text x="74.1" y="520" class="t">Abstain, prune</text><text x="22" y="544" class="d">only abstains go on; top-k keeps the</text><text x="22" y="562" class="d">candidates</text></g>
<g data-edge="prune->score"><path class="e" d="M44,576 V616" stroke="#69718a" marker-end="url(#instinct-flow-m-a0)"/>
</g>
<g data-step="score" data-n="3b.2"><rect class="gf-cb" x="4" y="616" width="332" height="86" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="628" width="4" height="62" rx="2" fill="#f472b6"/><text x="22" y="638" class="k" fill="#f472b6">THE OPEN LANE</text><circle cx="280.2" cy="634" r="3.5" fill="#4ade80"/><text x="318" y="638" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="648" width="42.1" height="22" rx="11" fill="#f472b6"/><text x="43" y="663.5" text-anchor="middle" class="n">3b.2</text><text x="74.1" y="664" class="t">Specialist scores</text><text x="22" y="688" class="d">locked per-domain artifacts — never blended</text></g>
<g data-edge="score->fuse"><path class="e" d="M44,702 V742" stroke="#69718a" marker-end="url(#instinct-flow-m-a0)"/>
</g>
<g data-step="fuse" data-n="3b.3"><rect class="gf-cb" x="4" y="742" width="332" height="104" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="754" width="4" height="80" rx="2" fill="#f472b6"/><text x="22" y="764" class="k" fill="#f472b6">THE OPEN LANE</text><circle cx="280.2" cy="760" r="3.5" fill="#4ade80"/><text x="318" y="764" text-anchor="end" class="s" fill="#4ade80">live</text><rect x="22" y="774" width="42.1" height="22" rx="11" fill="#f472b6"/><text x="43" y="789.5" text-anchor="middle" class="n">3b.3</text><text x="74.1" y="790" class="t">Fuse and calibrate</text><text x="22" y="814" class="d">a cascade pick or prior fusion returns one</text><text x="22" y="832" class="d">calibrated answer</text></g>
<g data-edge="fuse->enc"><path class="e" d="M44,846 V886" stroke="#69718a" marker-end="url(#instinct-flow-m-a0)"/>
<text class="el" x="56" y="870">still unsure</text>
</g>
<g data-step="enc" data-n="4"><rect class="gf-cb" x="4" y="886" width="332" height="86" rx="12" fill="#161a23" stroke="#a98bfa" stroke-opacity=".6"/><rect x="4" y="898" width="4" height="62" rx="2" fill="#a98bfa"/><text x="22" y="908" class="k" fill="#a98bfa">OUR HOSTS</text><circle cx="153" cy="904" r="3.5" fill="none" stroke="#9299ab" stroke-width="1.4"/><text x="318" y="908" text-anchor="end" class="s" fill="#9299ab">planned · record-only</text><circle cx="33" cy="929" r="11" fill="#a98bfa"/><text x="33" y="933.5" text-anchor="middle" class="n">4</text><text x="54" y="934" class="t">The encoder rung</text><text x="22" y="958" class="d">one rung deeper where bags read too coarse</text></g>
<g data-step="manifest" data-n="5"><rect class="gf-cb" x="4" y="1012" width="332" height="86" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="1024" width="4" height="62" rx="2" fill="#f472b6"/><text x="22" y="1034" class="k" fill="#f472b6">THE MANIFEST</text><circle cx="280.2" cy="1030" r="3.5" fill="#4ade80"/><text x="318" y="1034" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="1055" r="11" fill="#f472b6"/><text x="33" y="1059.5" text-anchor="middle" class="n">5</text><text x="54" y="1060" class="t">Registered arms</text><text x="22" y="1084" class="d">each beat free Reflex on one frozen read</text></g>
<g data-edge="fuse->ans"><rect x="4" y="1116" width="332" height="40" rx="12" fill="#ff8a3d" fill-opacity=".08" stroke="#ff8a3d" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="1142" class="el" style="fill:#ff8a3d">↺ from 3b.3 back to step 3a</text></g>
<g data-edge="enc->ans"><rect x="4" y="1174" width="332" height="58" rx="12" fill="#ff8a3d" fill-opacity=".08" stroke="#ff8a3d" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="1200" class="el" style="fill:#ff8a3d">↺ from 4 back to step 3a · the think</text><text x="22" y="1218" class="el" style="fill:#ff8a3d">returns — planned</text></g>
<g data-edge="manifest->score"><rect x="4" y="1250" width="332" height="58" rx="12" fill="#f472b6" fill-opacity=".08" stroke="#f472b6" stroke-opacity=".5" stroke-dasharray="4 4"/><text x="22" y="1276" class="el" style="fill:#f472b6">↺ from 5 back to step 3b.2 · swapped</text><text x="22" y="1294" class="el" style="fill:#f472b6">whole</text></g>
</svg>
