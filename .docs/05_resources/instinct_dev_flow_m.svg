<svg xmlns="http://www.w3.org/2000/svg" id="instinct-dev-flow-m" data-gfflow="1" viewBox="0 0 340 732" width="340" height="732" role="img" aria-labelledby="instinct-dev-flow-m-t instinct-dev-flow-m-d">
<title id="instinct-dev-flow-m-t">Instinct: how a specialist is made, locked and put on duty</title>
<desc id="instinct-dev-flow-m-d">6 steps in path order. 1. Make the corpus: assembled from public data, splits frozen (the corpus; live). 2. Train a specialist: one small model per domain (training; live). 3. The winner law: serve only a strict win over the free floor (training; live). 4. If a strict win: Lock it: the digest pinned, checked at every load (the artifact; live). 5. Register the row: the manifest — the one selection surface (the artifact; live). 6. Serve with receipts: build, input hash, decision hash, lane id (serving; live).</desc>
<style>#instinct-dev-flow-m .k{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}#instinct-dev-flow-m .t{font:700 15.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#instinct-dev-flow-m .d{font:400 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#instinct-dev-flow-m .n{font:700 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#instinct-dev-flow-m .s{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#instinct-dev-flow-m .el{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab}#instinct-dev-flow-m .e{fill:none;stroke-width:1.6}</style>
<defs><marker id="instinct-dev-flow-m-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="340" height="732" rx="14" fill="#11141b"/>
<g data-step="corpus" data-n="1"><rect class="gf-cb" x="4" y="8" width="332" height="86" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="20" width="4" height="62" rx="2" fill="#f472b6"/><text x="22" y="30" class="k" fill="#f472b6">THE CORPUS · PUBLIC DATA</text><circle cx="280.2" cy="26" r="3.5" fill="#4ade80"/><text x="318" y="30" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="51" r="11" fill="#f472b6"/><text x="33" y="55.5" text-anchor="middle" class="n">1</text><text x="54" y="56" class="t">Make the corpus</text><text x="22" y="80" class="d">assembled from public data, splits frozen</text></g>
<g data-edge="corpus->spec"><path class="e" d="M44,94 V134" stroke="#69718a" marker-end="url(#instinct-dev-flow-m-a0)"/>
</g>
<g data-step="spec" data-n="2"><rect class="gf-cb" x="4" y="134" width="332" height="86" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="146" width="4" height="62" rx="2" fill="#f472b6"/><text x="22" y="156" class="k" fill="#f472b6">TRAINING · ONE PER DOMAIN</text><circle cx="280.2" cy="152" r="3.5" fill="#4ade80"/><text x="318" y="156" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="177" r="11" fill="#f472b6"/><text x="33" y="181.5" text-anchor="middle" class="n">2</text><text x="54" y="182" class="t">Train a specialist</text><text x="22" y="206" class="d">one small model per domain</text></g>
<g data-edge="spec->holdout"><path class="e" d="M44,220 V260" stroke="#69718a" marker-end="url(#instinct-dev-flow-m-a0)"/>
</g>
<g data-step="holdout" data-n="3"><rect class="gf-cb" x="4" y="260" width="332" height="86" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="272" width="4" height="62" rx="2" fill="#f472b6"/><text x="22" y="282" class="k" fill="#f472b6">TRAINING · ONE PER DOMAIN</text><circle cx="280.2" cy="278" r="3.5" fill="#4ade80"/><text x="318" y="282" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="303" r="11" fill="#f472b6"/><text x="33" y="307.5" text-anchor="middle" class="n">3</text><text x="54" y="308" class="t">The winner law</text><text x="22" y="332" class="d">serve only a strict win over the free floor</text></g>
<g data-edge="holdout->lock"><path class="e" d="M44,346 V386" stroke="#69718a" marker-end="url(#instinct-dev-flow-m-a0)"/>
<text class="el" x="56" y="370">a strict win</text>
</g>
<g data-step="lock" data-n="4"><rect class="gf-cb" x="4" y="386" width="332" height="86" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="398" width="4" height="62" rx="2" fill="#f472b6"/><text x="22" y="408" class="k" fill="#f472b6">THE ARTIFACT · LOCKED</text><circle cx="280.2" cy="404" r="3.5" fill="#4ade80"/><text x="318" y="408" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="429" r="11" fill="#f472b6"/><text x="33" y="433.5" text-anchor="middle" class="n">4</text><text x="54" y="434" class="t">Lock it</text><text x="22" y="458" class="d">the digest pinned, checked at every load</text></g>
<g data-edge="lock->row"><path class="e" d="M44,472 V512" stroke="#69718a" marker-end="url(#instinct-dev-flow-m-a0)"/>
</g>
<g data-step="row" data-n="5"><rect class="gf-cb" x="4" y="512" width="332" height="86" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="524" width="4" height="62" rx="2" fill="#f472b6"/><text x="22" y="534" class="k" fill="#f472b6">THE ARTIFACT · LOCKED</text><circle cx="280.2" cy="530" r="3.5" fill="#4ade80"/><text x="318" y="534" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="555" r="11" fill="#f472b6"/><text x="33" y="559.5" text-anchor="middle" class="n">5</text><text x="54" y="560" class="t">Register the row</text><text x="22" y="584" class="d">the manifest — the one selection surface</text></g>
<g data-edge="row->srv"><path class="e" d="M44,598 V638" stroke="#69718a" marker-end="url(#instinct-dev-flow-m-a0)"/>
</g>
<g data-step="srv" data-n="6"><rect class="gf-cb" x="4" y="638" width="332" height="86" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><rect x="4" y="650" width="4" height="62" rx="2" fill="#f472b6"/><text x="22" y="660" class="k" fill="#f472b6">SERVING · RECEIPTS ON ANSWERS</text><circle cx="280.2" cy="656" r="3.5" fill="#4ade80"/><text x="318" y="660" text-anchor="end" class="s" fill="#4ade80">live</text><circle cx="33" cy="681" r="11" fill="#f472b6"/><text x="33" y="685.5" text-anchor="middle" class="n">6</text><text x="54" y="686" class="t">Serve with receipts</text><text x="22" y="710" class="d">build, input hash, decision hash, lane id</text></g>
</svg>
