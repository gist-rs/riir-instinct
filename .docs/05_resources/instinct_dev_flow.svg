<svg xmlns="http://www.w3.org/2000/svg" id="instinct-dev-flow" data-gfflow="1" viewBox="0 0 1756 724" width="1756" height="724" role="img" aria-labelledby="instinct-dev-flow-t instinct-dev-flow-d">
<title id="instinct-dev-flow-t">Instinct: how a specialist is made, locked and put on duty</title>
<desc id="instinct-dev-flow-d">6 steps in path order. 1. Make the corpus: assembled from public data, splits frozen (the corpus; live). 2. Train a specialist: one small model per domain (training; live). 3. The winner law: serve only a strict win over the free floor (training; live). 4. If a strict win: Lock it: the digest pinned, checked at every load (the artifact; live). 5. Register the row: the manifest — the one selection surface (the artifact; live). 6. Serve with receipts: build, input hash, decision hash, lane id (serving; live).</desc>
<style>#instinct-dev-flow .lh{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em}#instinct-dev-flow .ln{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#9299ab}#instinct-dev-flow .at{font:600 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#instinct-dev-flow .t{font:700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#e9ecf2}#instinct-dev-flow .d{font:400 13.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#c3c8d4}#instinct-dev-flow .n{font:700 13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#0d0f14}#instinct-dev-flow .s{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#instinct-dev-flow .el{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9299ab;paint-order:stroke;stroke:#11141b;stroke-width:4px;stroke-linejoin:round}#instinct-dev-flow .e{fill:none;stroke-width:1.6}#instinct-dev-flow .eb{fill:none;stroke-width:2}</style>
<defs><marker id="instinct-dev-flow-a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#69718a"/></marker></defs>
<rect width="1756" height="724" rx="14" fill="#11141b"/>
<g data-lane="data"><rect x="10" y="12" width="1736" height="166" rx="16" fill="#f472b6" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".4"/><text x="30" y="37"><tspan class="lh" fill="#f472b6">THE CORPUS</tspan><tspan class="ln" dx="12">public data · frozen splits</tspan></text></g>
<g data-lane="train"><rect x="10" y="190" width="1736" height="166" rx="16" fill="#f472b6" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".4"/><text x="30" y="215"><tspan class="lh" fill="#f472b6">TRAINING</tspan><tspan class="ln" dx="12">one per domain</tspan></text></g>
<g data-lane="artifact"><rect x="10" y="368" width="1736" height="166" rx="16" fill="#f472b6" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".4"/><text x="30" y="393"><tspan class="lh" fill="#f472b6">THE ARTIFACT</tspan><tspan class="ln" dx="12">locked · registered</tspan></text></g>
<g data-lane="serve"><rect x="10" y="546" width="1736" height="166" rx="16" fill="#f472b6" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".4"/><text x="30" y="571"><tspan class="lh" fill="#f472b6">SERVING</tspan><tspan class="ln" dx="12">receipts on answers</tspan></text></g>
<g data-edge="corpus->spec"><path class="e" d="M260,108 439,108 439,232" stroke="#69718a" marker-end="url(#instinct-dev-flow-a0)"/></g>
<g data-edge="spec->holdout"><path class="e" d="M554,286 618,286" stroke="#69718a" marker-end="url(#instinct-dev-flow-a0)"/></g>
<g data-edge="holdout->lock"><path class="e" d="M848,286 1027,286 1027,410" stroke="#69718a" marker-end="url(#instinct-dev-flow-a0)"/><text class="el" x="937.5" y="277" text-anchor="middle">a strict win</text></g>
<g data-edge="lock->row"><path class="e" d="M1142,464 1206,464" stroke="#69718a" marker-end="url(#instinct-dev-flow-a0)"/></g>
<g data-edge="row->srv"><path class="e" d="M1436,464 1615,464 1615,588" stroke="#69718a" marker-end="url(#instinct-dev-flow-a0)"/></g>
<g data-step="corpus" data-n="1"><rect class="gf-cb" x="30" y="54" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="52" cy="78" r="12" fill="#f472b6"/><text x="52" y="82.5" text-anchor="middle" class="n">1</text><text x="74" y="83" class="t">Make the corpus</text><text x="46" y="109" class="d">assembled from public data,</text><text x="46" y="128" class="d">splits frozen</text><circle cx="50" cy="146" r="4" fill="#4ade80"/><text x="60" y="150" class="s" fill="#4ade80">live</text></g>
<g data-step="spec" data-n="2"><rect class="gf-cb" x="324" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="346" cy="256" r="12" fill="#f472b6"/><text x="346" y="260.5" text-anchor="middle" class="n">2</text><text x="368" y="261" class="t">Train a specialist</text><text x="340" y="287" class="d">one small model per domain</text><circle cx="344" cy="324" r="4" fill="#4ade80"/><text x="354" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="holdout" data-n="3"><rect class="gf-cb" x="618" y="232" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="640" cy="256" r="12" fill="#f472b6"/><text x="640" y="260.5" text-anchor="middle" class="n">3</text><text x="662" y="261" class="t">The winner law</text><text x="634" y="287" class="d">serve only a strict win over the</text><text x="634" y="306" class="d">free floor</text><circle cx="638" cy="324" r="4" fill="#4ade80"/><text x="648" y="328" class="s" fill="#4ade80">live</text></g>
<g data-step="lock" data-n="4"><rect class="gf-cb" x="912" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="934" cy="434" r="12" fill="#f472b6"/><text x="934" y="438.5" text-anchor="middle" class="n">4</text><text x="956" y="439" class="t">Lock it</text><text x="928" y="465" class="d">the digest pinned, checked at</text><text x="928" y="484" class="d">every load</text><circle cx="932" cy="502" r="4" fill="#4ade80"/><text x="942" y="506" class="s" fill="#4ade80">live</text></g>
<g data-step="row" data-n="5"><rect class="gf-cb" x="1206" y="410" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="1228" cy="434" r="12" fill="#f472b6"/><text x="1228" y="438.5" text-anchor="middle" class="n">5</text><text x="1250" y="439" class="t">Register the row</text><text x="1222" y="465" class="d">the manifest — the one</text><text x="1222" y="484" class="d">selection surface</text><circle cx="1226" cy="502" r="4" fill="#4ade80"/><text x="1236" y="506" class="s" fill="#4ade80">live</text></g>
<g data-step="srv" data-n="6"><rect class="gf-cb" x="1500" y="588" width="230" height="108" rx="12" fill="#161a23" stroke="#f472b6" stroke-opacity=".6"/><circle cx="1522" cy="612" r="12" fill="#f472b6"/><text x="1522" y="616.5" text-anchor="middle" class="n">6</text><text x="1544" y="617" class="t">Serve with receipts</text><text x="1516" y="643" class="d">build, input hash, decision</text><text x="1516" y="662" class="d">hash, lane id</text><circle cx="1520" cy="680" r="4" fill="#4ade80"/><text x="1530" y="684" class="s" fill="#4ade80">live</text></g>
</svg>
